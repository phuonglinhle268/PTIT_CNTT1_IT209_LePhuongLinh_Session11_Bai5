name: CI Pipeline - Gradle Test & Docker Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Gradle Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Chạy kiểm thử Gradle & Build JAR
        run: ./gradlew test bootJar

  docker-build:
    name: Build and Push Docker Image
    needs: test   # Ràng buộc: chỉ chạy khi job 'test' thành công
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 17 để tạo file JAR cho Docker
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cấp quyền thực thi và Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest